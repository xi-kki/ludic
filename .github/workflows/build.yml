name: build-and-test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.89.0

      - name: Install Solana CLI
        run: |
          curl -sSL -o /tmp/solana-release.tar.bz2 \
            https://github.com/anza-xyz/agave/releases/download/v4.2.0/solana-release-x86_64-unknown-linux-gnu.tar.bz2
          tar -xjf /tmp/solana-release.tar.bz2 -C /usr/local
          echo "/usr/local/solana-release/bin" >> "$GITHUB_PATH"
          solana --version

      - name: Install Anchor CLI
        run: |
          curl -sSL -o /usr/local/bin/anchor \
            https://github.com/coral-xyz/anchor/releases/download/v1.1.2/anchor-1.1.2-x86_64-unknown-linux-gnu
          chmod +x /usr/local/bin/anchor
          anchor --version

      - name: Build program
        run: anchor build --ignore-keys

      - name: Run tests
        run: cargo test --manifest-path programs/ludic/Cargo.toml

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ludic-program
          path: |
            target/deploy/ludic.so
            target/idl/ludic.json
